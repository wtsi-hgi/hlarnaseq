# wtsi-hgi/hlarnaseq: launcher environment.
#
# This environment exists only to *launch* the pipeline and to run the
# fixture-building scripts under testdata-make/. No pipeline step depends on
# anything installed here.
#
# Every tool the pipeline itself runs is declared by the process that runs it:
# an environment.yml feeding that module's `conda` directive, paired with a
# matching pinned `container` directive, resolved by Nextflow under
# -profile conda/docker/singularity/apptainer. See docs/environment_setup.md.
#
# samtools is the one entry here that is not a launcher tool. It is retained
# solely because testdata-make/'s scripts invoke it directly (see
# testdata-make/README.md); no pipeline process uses it from this environment -
# ARCASHLA_EXTRACT, COUNTS_COMMONREF_HLA_REFORMAT and the vendored
# SAMTOOLS_SORT all declare their own bioconda::samtools=1.24. Drop it here if
# testdata-make/ ever stops needing it.
#
# Generated with `conda env export --from-history` and hand-trimmed.
channels:
  - conda-forge
  - bioconda
dependencies:
  - bioconda::nextflow
  - bioconda::nf-core
  - bioconda::nf-test
  - bioconda::samtools
