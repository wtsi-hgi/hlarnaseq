# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/environment-schema.json
# nf-core/hlarnaseq: shared python3 + R data-tools environment.
#
# Unlike every other environment.yml in this repository, this one is NOT
# module-local: it is shared by the twelve modules that run this pipeline's own
# bin/ analysis scripts or its small shell data-shuffling steps, each of which
# points its `conda` directive at this file and its `container` directive at
# the one image built from it:
#
#   HLA_CONSENSUS                  bin/call_hla_consensus.py           python3, pandas
#   HLAPM_PREPARE_INPUT            bin/consensus_to_hlapm.py           python3 (stdlib only)
#   ARCASHLA_COMBINE               bin/combine_arcashla_genotypes.R    jsonlite, dplyr, tibble, stringr, purrr
#   HLAPM_SUMMARIZE_READCOUNTS     bin/summarize_hla_readcounts.R      dplyr, tidyr
#   HLA_READCOUNT_RECONCILE_DIFF   bin/reconcile_hla_readcounts.py     python3, pandas
#   GTF_HLA_GENE_ID_CHECK          bin/check_gtf_hla_gene_ids.py       python3 (stdlib only)
#   COMBINE_FINAL_COUNTS_PATCH     bin/combine_final_counts.py         python3 (stdlib only)
#   COUNTS_COMMONREF_HLA_REFORMAT  bin/reformat_rnaseq_featurecounts.py  samtools, python3 (stdlib only)
#   HLALA_COMBINE                  (inline shell)                      bash, coreutils, awk
#   HIBAG_COMBINE                  (inline shell)                      bash, coreutils, awk
#   HLAPM_COMBINE_GTF              (inline shell)                      bash, coreutils, grep
#   HLAPM_LIST_STAR_TARGETS        (inline shell)                      bash, coreutils, findutils
#   HLAPM_RESOLVE_SAMPLE_ALLELES   (inline shell)                      bash, coreutils
#
# One file rather than thirteen near-identical module-local ones: these are
# small data transformations over the same two interpreters plus a POSIX shell,
# and thirteen copies of an overlapping package list would drift. See
# containers/datatools/README.md.
#
# The shell-only consumers add nothing to this file: bash, coreutils, awk,
# findutils and grep all come from the image's Debian base under
# docker/singularity, and from the host under -profile conda - the same
# arrangement nf-core's own pure-shell modules rely on. They point here so that
# they declare *some* reproducible environment rather than none at all.
#
# This replaces both the python/R half of the operator-prepared `nf-core`
# environment (envs/nf-core.yml, now launcher-only) and the R half of the
# `hlapm-quantify` environment (envs/hlapm-quantify.yml, now removed).
#
# Versions are pinned to those the pipeline's existing published results were
# produced with, so containerization does not silently change any output. The
# one exception is r-tidyr: its previous version (1.2.1) was built against
# r-base 4.0.3 in the old `hlapm-quantify` environment, and there is no such
# build for the r-base pinned here, so it necessarily moves. That is why
# HLAPM_SUMMARIZE_READCOUNTS's output was diffed against a known-good run when
# this image was introduced.
#
# procps-ng provides `ps`, which Nextflow's task wrapper runs inside every
# container to collect trace metrics; the mambaorg/micromamba base image does
# not ship it. Container-only need - any regular Linux host already has it.
#
# samtools/htslib are the one deliberate exception to README.md's "prefer
# adding a package here only if it serves a bin/ script of this kind" rule.
# COUNTS_COMMONREF_HLA_REFORMAT runs `samtools view` to turn
# SUBREAD_FEATURECOUNTS's reannotated `-R BAM` output into the text stream
# bin/reformat_rnaseq_featurecounts.py parses, so it needs samtools *and*
# python3 in one environment - a combination with no prebuilt public image.
# The alternative, a fourth module-local Dockerfile for a single `samtools
# view` call, was judged a worse trade than a slightly larger shared image.
# The pin is deliberately identical to ARCASHLA_EXTRACT's and the vendored
# nf-core SAMTOOLS_SORT's (1.24), so the pipeline can never run more than one
# samtools version across its three call sites.
channels:
  - conda-forge
  - bioconda
dependencies:
  - conda-forge::python=3.14.6
  - conda-forge::pandas=3.0.3
  - conda-forge::r-base=4.5.3
  - conda-forge::r-jsonlite=2.0.0
  - conda-forge::r-dplyr=1.2.1
  - conda-forge::r-tibble=3.3.1
  - conda-forge::r-stringr=1.6.0
  - conda-forge::r-purrr=1.2.2
  # 1.3.2, not the 1.2.1 the old `hlapm-quantify` environment had: that
  # version only has builds for older r-base. Pinned here to what the solver
  # picks for r-base 4.5.3, so this file stays fully reproducible.
  - conda-forge::r-tidyr=1.3.2
  - conda-forge::procps-ng
  # renovate: datasource=conda depName=bioconda/htslib
  - bioconda::htslib=1.24
  # renovate: datasource=conda depName=bioconda/samtools
  - bioconda::samtools=1.24
